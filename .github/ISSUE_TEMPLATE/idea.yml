name: 功能建议
description: 建议新的创作能力，或改进操作、提示词和使用体验
title: "[建议] "
body:
  - type: textarea
    id: workflow
    attributes:
      label: 想完成的任务
      description: 说明你想做什么、哪一步不顺手，以及希望工作站怎么帮你。
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: 补充示例（选填）
      description: 可以附使用场景、截图或一段提示词。
